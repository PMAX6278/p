[TARGET]
name = HotSpot
url = http://mp.wifi
login_path = /login

[SETTINGS]
code_length = 6
charset = 0123456789
random_order = false
max_workers = 50
batch_submit = 200
connection_pool = 100
random_headers = true
random_dst = true
timeout = 10
retry_count = 2
delay_min = 0.0
delay_max = 0.05

[HISTORY]
file = history.txt
success = success.txt

[OUTPUT]
show_failed = false
show_limited = false
show_progress = true
